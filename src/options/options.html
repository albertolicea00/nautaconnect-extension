<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <h1 data-i18n="settingsTitle"></h1>

  <form id="form">
    <label>
      <span data-i18n="usernameLabel"></span>
      <input id="username" type="text" placeholder="usuario@nauta.com.cu" autocomplete="username">
    </label>

    <label>
      <span data-i18n="passwordLabel"></span>
      <input id="password" type="password" autocomplete="current-password">
    </label>

    <label>
      <span data-i18n="languageLabel"></span>
      <select id="language">
        <option value="auto" data-i18n="languageAuto"></option>
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>

    <p class="hint" data-i18n="storageHint"></p>

    <button type="submit" data-i18n="save"></button>
    <span id="savedMsg" data-i18n="saved" hidden></span>
  </form>

  <script src="../i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
